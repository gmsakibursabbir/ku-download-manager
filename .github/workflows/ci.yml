name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: app/pnpm-lock.yaml }
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev aria2 ffmpeg
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp && sudo chmod +x /usr/local/bin/yt-dlp
      - name: Windows engines
        if: runner.os == 'Windows'
        run: choco install aria2 yt-dlp ffmpeg -y --no-progress
      - name: Frontend
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm build
      - name: Extension
        working-directory: extension
        run: node build.mjs
      - name: Rust tests (unit, aria2 end-to-end, KuHTTP failure suite)
        run: cargo test --workspace --release -- --test-threads 4

  # Tag push (vX.Y.Z) → draft GitHub release with the Windows installer (.exe),
  # Linux .deb/.rpm and an Arch Linux package. Publish the draft by hand.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: src-tauri/tauri.bundle.conf.json
          - os: ubuntu-22.04
            bundle: src-tauri/tauri.bundle.linux.conf.json
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev rpm
      - name: Windows engines (official builds, bundled into the installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $d = "$env:RUNNER_TEMP\engines"; New-Item -ItemType Directory -Force $d | Out-Null
          Invoke-WebRequest https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-win-64bit-build1.zip -OutFile "$d\aria2.zip"
          Expand-Archive "$d\aria2.zip" "$d\aria2"
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile "$d\yt-dlp.exe"
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile "$d\ffmpeg.zip"
          Expand-Archive "$d\ffmpeg.zip" "$d\ffmpeg"
          $aria = (Get-ChildItem "$d\aria2" -Recurse -Filter aria2c.exe).FullName
          $ff = (Get-ChildItem "$d\ffmpeg" -Recurse -Filter ffmpeg.exe).FullName
          "KU_ARIA2C_PATH=$aria" >> $env:GITHUB_ENV
          "KU_YT_DLP_PATH=$d\yt-dlp.exe" >> $env:GITHUB_ENV
          "KU_FFMPEG_PATH=$ff" >> $env:GITHUB_ENV
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - name: Extension (unpacked + kudmx.xpi, kudmx.crx when KU_EXTENSION_KEY is set)
        working-directory: extension
        env:
          KU_EXTENSION_KEY: ${{ secrets.KU_EXTENSION_KEY }}
        run: node build.mjs && node pack.mjs
      - run: node scripts/prepare-sidecars.mjs
      - name: Updater signing (only when the key secret exists)
        id: sign
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "args=" >> "$GITHUB_OUTPUT"; echo "json=true" >> "$GITHUB_OUTPUT"
          else
            echo '{"bundle":{"createUpdaterArtifacts":false}}' > app/src-tauri/tauri.nosign.conf.json
            echo "args=--config src-tauri/tauri.nosign.conf.json" >> "$GITHUB_OUTPUT"; echo "json=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          args: --config ${{ matrix.bundle }} ${{ steps.sign.outputs.args }}
          tagName: ${{ github.ref_name }}
          releaseName: KuDownloader ${{ github.ref_name }}
          releaseDraft: true
          includeUpdaterJson: ${{ steps.sign.outputs.json }}
      - name: Keep the .deb for the Arch package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: target/release/bundle/deb/*.deb
          if-no-files-found: error

  arch:
    needs: release
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: deb, path: pkg }
      - name: Build the pacman package
        run: |
          pacman -Syu --noconfirm github-cli
          useradd -m builder
          mv pkg/*.deb pkg/kudownloader.deb
          cp packaging/arch/PKGBUILD pkg/
          ver=$(sed -n 's/^  "version": *"\([^"]*\)".*/\1/p' app/src-tauri/tauri.conf.json | head -1)
          sed -i "s/^pkgver=.*/pkgver=${ver//-/_}/" pkg/PKGBUILD
          chown -R builder pkg
          su builder -c "cd pkg && makepkg --nodeps --noconfirm"
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: pkg/*.pkg.tar.zst
      - name: Attach to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" pkg/*.pkg.tar.zst --clobber --repo "${{ github.repository }}"
