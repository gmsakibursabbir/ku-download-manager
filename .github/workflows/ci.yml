name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: app/pnpm-lock.yaml }
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev aria2 ffmpeg
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp && sudo chmod +x /usr/local/bin/yt-dlp
      - name: macOS engines
        if: runner.os == 'macOS'
        run: brew install aria2
      - name: Windows engines
        if: runner.os == 'Windows'
        run: choco install aria2 -y --no-progress
      - name: Frontend
        working-directory: app
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm build
      - name: Extension
        working-directory: extension
        run: node build.mjs && node pack.mjs
      - name: Rust tests (unit, aria2 end-to-end, KuHTTP failure suite)
        run: cargo test --workspace --release -- --test-threads 4

  # Tag push (vX.Y.Z) → draft GitHub release: Windows .exe, Linux .deb/.rpm
  # (x86_64 and arm64) and Arch .pkg.tar.zst; the Android workflow adds the
  # APKs. Publish the draft by hand.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundle: src-tauri/tauri.bundle.conf.json
          - os: ubuntu-22.04
            bundle: src-tauri/tauri.bundle.linux.conf.json
          - os: ubuntu-22.04-arm
            bundle: src-tauri/tauri.bundle.linux.conf.json
            extra: --bundles deb,rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev rpm
      - name: aria2 for the Windows installer (official build)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $d = Join-Path $env:RUNNER_TEMP "engines"
          New-Item -ItemType Directory -Force $d | Out-Null
          Invoke-WebRequest https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-win-64bit-build1.zip -OutFile (Join-Path $d "aria2.zip")
          Expand-Archive (Join-Path $d "aria2.zip") (Join-Path $d "aria2")
          $aria = (Get-ChildItem (Join-Path $d "aria2") -Recurse -Filter aria2c.exe).FullName
          "KU_ARIA2C_PATH=$aria" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - name: Extension (unpacked + kudmx.xpi, kudmx.crx when KU_EXTENSION_KEY is set)
        working-directory: extension
        env:
          KU_EXTENSION_KEY: ${{ secrets.KU_EXTENSION_KEY }}
        run: node build.mjs && node pack.mjs
      - name: Helpers (ku-native-host, ku)
        shell: bash
        run: node scripts/prepare-sidecars.mjs ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
      - name: Optional signing configuration
        id: sign
        shell: bash
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          WIN_CERT: ${{ secrets.WINDOWS_CERTIFICATE }}
          WIN_CERT_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          args=""
          if [ -z "$UPDATER_KEY" ]; then
            echo '{"bundle":{"createUpdaterArtifacts":false}}' > app/src-tauri/tauri.nosign.conf.json
            args="--config src-tauri/tauri.nosign.conf.json"
            echo "json=false" >> "$GITHUB_OUTPUT"
          else
            echo "json=true" >> "$GITHUB_OUTPUT"
          fi
          # Windows Authenticode: WINDOWS_CERTIFICATE = base64 .pfx
          if [ "$RUNNER_OS" = "Windows" ] && [ -n "$WIN_CERT" ]; then
            echo "$WIN_CERT" | base64 -d > "$RUNNER_TEMP/cert.pfx"
            thumb=$(powershell -NoProfile -Command "\$p = ConvertTo-SecureString -String \$env:WIN_CERT_PASSWORD -Force -AsPlainText; (Import-PfxCertificate -FilePath \"$RUNNER_TEMP/cert.pfx\" -CertStoreLocation Cert:\\CurrentUser\\My -Password \$p).Thumbprint")
            rm -f "$RUNNER_TEMP/cert.pfx"
            printf '{"bundle":{"windows":{"certificateThumbprint":"%s","digestAlgorithm":"sha256","timestampUrl":"http://timestamp.digicert.com"}}}' "$thumb" > app/src-tauri/tauri.winsign.conf.json
            args="$args --config src-tauri/tauri.winsign.conf.json"
          fi
          if [ -n "${{ matrix.target }}" ]; then args="$args --target ${{ matrix.target }}"; fi
          echo "args=$args ${{ matrix.extra }}" >> "$GITHUB_OUTPUT"
      # macOS signing + notarization only when the secrets exist: an empty
      # APPLE_CERTIFICATE makes the bundler try (and fail) to import it.
      - name: Apple signing environment (optional)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              { echo "$v<<__KU_EOF__"; printenv "$v"; echo "__KU_EOF__"; } >> "$GITHUB_ENV"
            done
          else
            echo "No Apple signing secrets: building an unsigned app."
          fi
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          args: --config ${{ matrix.bundle }} ${{ steps.sign.outputs.args }}
          tagName: ${{ github.ref_name }}
          releaseName: KuDownloader ${{ github.ref_name }}
          releaseDraft: true
          includeUpdaterJson: ${{ steps.sign.outputs.json }}

  linux-extras:
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/linux-extras.yml
    with:
      tag: ${{ github.ref_name }}

  # Browser stores (optional; each step runs only when its secrets exist).
  extension-stores:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
      KU_EXTENSION_KEY: ${{ secrets.KU_EXTENSION_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build
        working-directory: extension
        run: node build.mjs && node pack.mjs
      - name: Firefox — Mozilla-signed kudmx.xpi (unlisted, self-distributed)
        if: env.AMO_JWT_ISSUER != ''
        working-directory: extension
        run: npm install --no-save web-ext@8 && node sign-firefox.mjs
      - name: Attach the signed add-on to the draft release
        if: env.AMO_JWT_ISSUER != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" extension/dist/kudmx.signed.xpi --clobber --repo "${{ github.repository }}" || echo "release not created yet; the signed xpi is in the job artifacts"
      - name: Chrome Web Store — upload and publish
        if: env.CWS_CLIENT_ID != ''
        run: npx --yes chrome-webstore-upload-cli@3 upload --source extension/dist/kudmx-chrome.zip --extension-id "$CWS_EXTENSION_ID" --client-id "$CWS_CLIENT_ID" --client-secret "$CWS_CLIENT_SECRET" --refresh-token "$CWS_REFRESH_TOKEN" --auto-publish
      - uses: actions/upload-artifact@v4
        with:
          name: extension-packages
          path: extension/dist/kudmx*
