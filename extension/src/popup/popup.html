<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>KuDownloader</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <img src="../icons/32x32.png" alt="" width="18" height="18" />
      <span class="brand">KuDownloader</span>
      <span id="status" class="status" data-state="checking">Checking…</span>
    </header>

    <div id="problem" class="problem" hidden></div>

    <section>
      <div class="section-head">
        <span>Media on this page</span>
        <span id="count" class="count"></span>
      </div>
      <ul id="media" class="media"></ul>
      <p id="nomedia" class="empty">No video or audio detected yet. Start playback to detect streams.</p>
      <button id="pageMedia" class="row-btn" type="button" hidden>Download this video with KuDownloader…</button>
    </section>

    <nav class="actions">
      <button id="all" type="button">Download all links…</button>
      <button id="selected" type="button">Download selected links…</button>
      <button id="open" type="button">Open KuDownloader</button>
    </nav>

    <footer>
      <label class="toggle">
        <input id="intercept" type="checkbox" />
        <span>Take over downloads in this browser</span>
      </label>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
