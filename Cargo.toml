[workspace]
resolver = "2"
members = [
    "crates/ku-proto",
    "crates/kucore",
    "crates/ku-cli",
    "crates/ku-native-host",
    "app/src-tauri",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
authors = ["KUDUY"]
rust-version = "1.80"

[workspace.dependencies]
ku-proto = { path = "crates/ku-proto" }
kucore = { path = "crates/kucore" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "io-util", "net", "fs", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 1
